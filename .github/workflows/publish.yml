name: Publish happy-server image

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream SHA
        id: upstream
        run: |
          upstream_sha=$(git ls-remote https://github.com/slopus/happy.git refs/heads/main | awk '{print $1}')
          upstream_short=${upstream_sha:0:7}
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$upstream_short" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        run: |
          build_short=${GITHUB_SHA:0:7}
          tag="server-${{ steps.upstream.outputs.upstream_short }}-hs-${build_short}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=happy-server
          cache-to: type=gha,scope=happy-server,mode=max
          tags: |
            ghcr.io/cdenneen/happy-server:${{ steps.tags.outputs.tag }}
            ghcr.io/cdenneen/happy-server:latest
          build-args: |
            UPSTREAM_REF=${{ steps.upstream.outputs.upstream_sha }}
            UPSTREAM_REPO=https://github.com/slopus/happy.git

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ghcr.io/cdenneen/happy-server@${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/cdenneen/happy-server@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            ghcr.io/cdenneen/happy-server@${{ steps.build.outputs.digest }}

      - name: Build local image for schema validation
        run: |
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --cache-from type=gha,scope=happy-server \
            --cache-to type=gha,scope=happy-server,mode=max \
            --build-arg UPSTREAM_REF=${{ steps.upstream.outputs.upstream_sha }} \
            --build-arg UPSTREAM_REPO=https://github.com/slopus/happy.git \
            -t happy-server:ci \
            .

      - name: Validate PGlite schema
        run: |
          docker run --rm \
            -e HANDY_MASTER_SECRET=ci-secret \
            -e DATA_DIR=/data \
            -e PGLITE_DIR=/data/pglite \
            -v "$GITHUB_WORKSPACE/ci-data:/data" \
            happy-server:ci \
            yarn --cwd packages/happy-server standalone migrate

      - name: Validate Postgres schema
        run: |
          set -euo pipefail
          docker network create happy-ci
          docker run -d --name happy-postgres --network happy-ci \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=happy-server \
            postgres:16
          for i in $(seq 1 30); do
            if docker exec happy-postgres pg_isready -U postgres; then
              break
            fi
            sleep 1
          done
          docker run --rm --network happy-ci \
            -e HANDY_MASTER_SECRET=ci-secret \
            -e DATABASE_URL=postgresql://postgres:postgres@happy-postgres:5432/happy-server \
            happy-server:ci \
            yarn --cwd packages/happy-server prisma migrate deploy
          docker rm -f happy-postgres
          docker network rm happy-ci

      - name: Validate server health (PGlite)
        run: |
          set -euo pipefail
          docker run -d --name happy-server-ci \
            -p 3000:3000 \
            -e HANDY_MASTER_SECRET=ci-secret \
            -e DATA_DIR=/data \
            -e PGLITE_DIR=/data/pglite \
            -v "$GITHUB_WORKSPACE/ci-data:/data" \
            happy-server:ci
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:3000/health > /dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker logs happy-server-ci || true
              exit 1
            fi
            sleep 2
          done
          curl -fsS --retry 5 --retry-connrefused --retry-delay 2 --max-time 5 http://localhost:3000/health
          docker rm -f happy-server-ci
