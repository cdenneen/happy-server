name: Publish happy-server image

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream SHA
        id: upstream
        run: |
          upstream_sha=$(git ls-remote https://github.com/slopus/happy.git refs/heads/main | awk '{print $1}')
          upstream_short=${upstream_sha:0:7}
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_short=$upstream_short" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        run: |
          build_short=${GITHUB_SHA:0:7}
          tag="server-${{ steps.upstream.outputs.upstream_short }}-hs-${build_short}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cdenneen/happy-server:${{ steps.tags.outputs.tag }}
            ghcr.io/cdenneen/happy-server:latest
          build-args: |
            UPSTREAM_REF=${{ steps.upstream.outputs.upstream_sha }}
            UPSTREAM_REPO=https://github.com/slopus/happy.git
            UPSTREAM_PATH=packages/happy-server
